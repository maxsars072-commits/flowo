<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowo — Все мессенджеры в одном потоке</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-tertiary: #2a2a2a;
  --text-primary: #fff; --text-secondary: #888; --border-color: #2a2a2a;
  --accent: #667eea; --accent2: #764ba2;
  --message-incoming: #2a2a2a; --input-bg: #0f0f0f;
  --hover-bg: #222; --active-bg: #2a2a2a;
}
body.light-theme {
  --bg-primary: #f5f5f5; --bg-secondary: #ffffff; --bg-tertiary: #e8e8e8;
  --text-primary: #1a1a1a; --text-secondary: #666; --border-color: #e0e0e0;
  --message-incoming: #e8e8e8; --input-bg: #ffffff;
  --hover-bg: #f0f0f0; --active-bg: #e8e8e8;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
.sidebar { width: 340px; min-width: 250px; max-width: 500px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: relative; transition: background 0.3s, border-color 0.3s; }
.resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; background: transparent; transition: background 0.2s; z-index: 10; }
.resize-handle:hover, .resize-handle.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 1.5em; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.8em; }
.header-controls { display: flex; gap: 8px; align-items: center; }
.theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg-tertiary); color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2em; transition: transform 0.2s; }
.theme-toggle:hover { transform: scale(1.1); }
.status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75em; padding: 4px 10px; border-radius: 12px; background: var(--bg-tertiary); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.filters { padding: 12px 20px; display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); overflow-x: auto; }
.filter-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border-color); background: transparent; color: var(--text-secondary); font-size: 0.8em; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.filter-btn:hover { background: var(--hover-bg); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chat-list { flex: 1; overflow-y: auto; }
.chat-item { padding: 14px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.15s; display: flex; gap: 12px; }
.chat-item:hover { background: var(--hover-bg); }
.chat-item.active { background: var(--active-bg); }
.chat-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.1em; flex-shrink: 0; color: #fff; }
.chat-info { flex: 1; min-width: 0; }
.chat-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.chat-name { font-weight: 600; font-size: 0.95em; display: flex; align-items: center; gap: 6px; }
.chat-time { font-size: 0.75em; color: var(--text-secondary); }
.chat-preview { font-size: 0.85em; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unread-badge { background: var(--accent); color: #fff; font-size: 0.7em; padding: 2px 6px; border-radius: 10px; margin-left: 6px; }
.main { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); transition: background 0.3s; }
.main-header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); background: var(--bg-secondary); display: flex; align-items: center; gap: 12px; transition: background 0.3s; }
.header-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; }
.header-info { flex: 1; }
.header-name { font-weight: 600; font-size: 1.05em; }
.header-status { font-size: 0.8em; color: var(--text-secondary); }
.messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.message { max-width: 70%; padding: 12px 16px; border-radius: 18px; font-size: 0.95em; line-height: 1.5; animation: slideIn 0.3s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.incoming { background: var(--message-incoming); align-self: flex-start; border-bottom-left-radius: 4px; }
.message.outgoing { background: linear-gradient(135deg, var(--accent), var(--accent2)); align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
.message-meta { font-size: 0.7em; color: var(--text-secondary); margin-top: 6px; text-align: right; }
.message-source { font-size: 0.7em; color: var(--text-secondary); margin-bottom: 4px; }
.input-area { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--bg-secondary); display: flex; gap: 12px; align-items: center; }
.input-area input { flex: 1; padding: 14px 18px; border-radius: 24px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-primary); outline: none; font-size: 0.95em; }
.input-area input:focus { border-color: var(--accent); }
.input-area button { padding: 14px 24px; border-radius: 24px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
.input-area button:hover { transform: scale(1.05); }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); text-align: center; padding: 40px; }
.empty-state h2 { font-size: 1.8em; margin-bottom: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.empty-state p { font-size: 1.1em; max-width: 500px; line-height: 1.6; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo"><div class="logo-icon">F</div>Flowo</div>
    <div class="header-controls">
      <button class="theme-toggle" id="themeToggle">🌙</button>
      <div class="status-badge"><div class="status-dot"></div><span>Онлайн</span></div>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="telegram">✈️ Telegram</button>
    <button class="filter-btn" data-filter="whatsapp">🟢 WhatsApp</button>
    <button class="filter-btn" data-filter="max">🔵 MAX</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="resize-handle" id="resizeHandle"></div>
</div>
<div class="main">
  <div class="main-header" id="mainHeader" style="display:none;">
    <div class="header-avatar" id="headerAvatar"></div>
    <div class="header-info"><div class="header-name" id="headerName"></div><div class="header-status">в сети</div></div>
  </div>
  <div class="messages" id="messagesContainer">
    <div class="empty-state"><h2>Все мессенджеры — в одном потоке</h2><p>Выберите диалог слева, чтобы увидеть переписку. Flowo объединяет Telegram, WhatsApp и MAX в едином интерфейсе.</p></div>
  </div>
  <div class="input-area" id="inputArea" style="display:none;">
    <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>
</div>
<script>
const chats = [
  { id: '1', name: 'Алексей Петров', source: 'telegram', color: '#3b82f6', lastMessage: 'Отлично! Работаю над проектом Flowo', time: '14:32', unread: 2 },
  { id: '2', name: 'Марина Иванова', source: 'whatsapp', color: '#22c55e', lastMessage: 'Встретимся завтра в 15:00?', time: '13:45', unread: 0 },
  { id: '3', name: 'Дмитрий Соколов', source: 'max', color: '#0ea5e9', lastMessage: 'Документы готовы к отправке', time: '12:20', unread: 1 },
  { id: '4', name: 'Анна Кузнецова', source: 'telegram', color: '#3b82f6', lastMessage: 'Спасибо за помощь! 🙏', time: '11:15', unread: 0 },
  { id: '5', name: 'Команда Flowo', source: 'whatsapp', color: '#22c55e', lastMessage: 'Релиз запланирован на пятницу', time: 'Вчера', unread: 5 }
];
const messages = {
  '1': [
    { from: 'Алексей Петров', text: 'Привет! Как продвигается разработка?', time: '14:30', source: 'telegram', isOutgoing: false },
    { from: 'Вы', text: 'Привет! Почти закончил интерфейс', time: '14:31', source: 'telegram', isOutgoing: true },
    { from: 'Алексей Петров', text: 'Отлично! Работаю над проектом Flowo', time: '14:32', source: 'telegram', isOutgoing: false }
  ],
  '2': [
    { from: 'Марина Иванова', text: 'Привет! Есть планы на завтра?', time: '13:40', source: 'whatsapp', isOutgoing: false },
    { from: 'Вы', text: 'Да, свободен после обеда', time: '13:42', source: 'whatsapp', isOutgoing: true },
    { from: 'Марина Иванова', text: 'Встретимся завтра в 15:00?', time: '13:45', source: 'whatsapp', isOutgoing: false }
  ],
  '3': [{ from: 'Дмитрий Соколов', text: 'Документы готовы к отправке', time: '12:20', source: 'max', isOutgoing: false }],
  '4': [
    { from: 'Вы', text: 'Рад был помочь!', time: '11:10', source: 'telegram', isOutgoing: true },
    { from: 'Анна Кузнецова', text: 'Спасибо за помощь! ', time: '11:15', source: 'telegram', isOutgoing: false }
  ],
  '5': [
    { from: 'Команда Flowo', text: 'Всем привет! Обновление статуса проекта', time: 'Вчера', source: 'whatsapp', isOutgoing: false },
    { from: 'Вы', text: 'Готов к демо', time: 'Вчера', source: 'whatsapp', isOutgoing: true },
    { from: 'Команда Flowo', text: 'Релиз запланирован на пятницу', time: 'Вчера', source: 'whatsapp', isOutgoing: false }
  ]
};
let currentChatId = null, currentFilter = 'all';
const chatList = document.getElementById('chatList');
const messagesContainer = document.getElementById('messagesContainer');
const mainHeader = document.getElementById('mainHeader');
const headerAvatar = document.getElementById('headerAvatar');
const headerName = document.getElementById('headerName');
const inputArea = document.getElementById('inputArea');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const themeToggle = document.getElementById('themeToggle');
const sidebar = document.getElementById('sidebar');
const resizeHandle = document.getElementById('resizeHandle');

const savedTheme = localStorage.getItem('flowo-theme') || 'dark';
if (savedTheme === 'light') { document.body.classList.add('light-theme'); themeToggle.textContent = '☀️'; }
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('light-theme');
  const isLight = document.body.classList.contains('light-theme');
  themeToggle.textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('flowo-theme', isLight ? 'light' : 'dark');
});

let isResizing = false, startX = 0, startWidth = 0;
resizeHandle.addEventListener('mousedown', (e) => { isResizing = true; startX = e.clientX; startWidth = sidebar.offsetWidth; resizeHandle.classList.add('active'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; });
document.addEventListener('mousemove', (e) => { if (!isResizing) return; const w = startWidth + (e.clientX - startX); if (w >= 250 && w <= 500) sidebar.style.width = w + 'px'; });
document.addEventListener('mouseup', () => { if (isResizing) { isResizing = false; resizeHandle.classList.remove('active'); document.body.style.cursor = ''; document.body.style.userSelect = ''; } });

function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

function getSourceIcon(source) { return { telegram: '✈️', whatsapp: '🟢', max: '🔵' }[source] || '💬'; }

function renderChatList() {
  const filtered = currentFilter === 'all' ? chats : chats.filter(c => c.source === currentFilter);
  if (filtered.length === 0) { chatList.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><p>Нет чатов</p></div>'; return; }
  chatList.innerHTML = filtered.map(chat => `
    <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="selectChat('${chat.id}')">
      <div class="chat-avatar" style="background:${chat.color}">${chat.name[0]}</div>
      <div class="chat-info">
        <div class="chat-header"><div class="chat-name">${getSourceIcon(chat.source)} ${chat.name}</div><div class="chat-time">${chat.time}</div></div>
        <div class="chat-preview">${chat.lastMessage}${chat.unread > 0 ? `<span class="unread-badge">${chat.unread}</span>` : ''}</div>
      </div>
    </div>`).join('');
}

function selectChat(chatId) {
  currentChatId = chatId;
  const chat = chats.find(c => c.id === chatId);
  if (chat) {
    chat.unread = 0;
    headerAvatar.textContent = chat.name[0]; headerAvatar.style.background = chat.color;
    headerName.textContent = chat.name;
    mainHeader.style.display = 'flex'; inputArea.style.display = 'flex';
    renderChatList(); renderMessages();
  }
}

function renderMessages() {
  const chatMessages = messages[currentChatId] || [];
  if (chatMessages.length === 0) { messagesContainer.innerHTML = '<div class="empty-state"><p>Нет сообщений</p></div>'; return; }
  messagesContainer.innerHTML = chatMessages.map(msg => `
    <div class="message ${msg.isOutgoing ? 'outgoing' : 'incoming'}">
      <div class="message-source">${getSourceIcon(msg.source)} ${msg.from}</div>
      <div>${msg.text}</div>
      <div class="message-meta">${msg.time} ${msg.isOutgoing ? '✓✓' : ''}</div>
    </div>`).join('');
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || !currentChatId) return;
  const chat = chats.find(c => c.id === currentChatId);
  messages[currentChatId].push({ from: 'Вы', text, time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), source: chat.source, isOutgoing: true });
  chat.lastMessage = text; chat.time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  messageInput.value = ''; renderChatList(); renderMessages();
  setTimeout(() => {
    const responses = ['Отлично!', 'Понял тебя', 'Супер! 👍', 'Хорошо, договорились', 'Интересно!'];
    const reply = { from: chat.name, text: responses[Math.floor(Math.random() * responses.length)], time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), source: chat.source, isOutgoing: false };
    messages[currentChatId].push(reply); chat.lastMessage = reply.text; chat.time = reply.time;
    if (currentChatId !== chat.id) chat.unread = (chat.unread || 0) + 1;
    renderChatList(); if (currentChatId === chat.id) renderMessages();
    playNotificationSound();
  }, 1500);
}

document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); currentFilter = btn.dataset.filter; renderChatList();
}));
sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
renderChatList();
</script>
</body>
</html>
